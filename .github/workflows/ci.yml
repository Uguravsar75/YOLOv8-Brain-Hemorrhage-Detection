name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (CPU PyTorch + YOLOv8)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics numpy pandas scikit-learn Pillow opencv-python-headless matplotlib seaborn PyYAML tqdm

      - name: Run unit tests
        env:
          YOLO_CONFIG_DIR: /tmp
          MPLCONFIGDIR: /tmp
        run: python -m unittest discover -s tests -v
